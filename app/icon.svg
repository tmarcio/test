<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fundo circular vermelho oficial #C62E1F -->
  <circle cx="100" cy="100" r="100" fill="#C62E1F"/>

  <!-- Colher (por baixo): contorno laranja + interior dourado + cabo laranja -->
  <g transform="rotate(45 100 100)">
    <ellipse cx="100" cy="58" rx="29" ry="42" fill="#E8762C"/>
    <ellipse cx="100" cy="56" rx="24" ry="37" fill="#F0A12E"/>
    <rect x="93" y="86" width="14" height="106" rx="7" fill="#E8762C"/>
    <circle cx="100" cy="190" r="7" fill="#E8762C"/>
  </g>

  <!-- Garfo (por cima): 4 dentes brancos + corpo + cabo -->
  <g transform="rotate(-45 100 100)">
    <rect x="78"  y="42" width="5.5" height="48" rx="2.75" fill="#FFFFFF"/>
    <rect x="91"  y="42" width="5.5" height="48" rx="2.75" fill="#FFFFFF"/>
    <rect x="104" y="42" width="5.5" height="48" rx="2.75" fill="#FFFFFF"/>
    <rect x="117" y="42" width="5.5" height="48" rx="2.75" fill="#FFFFFF"/>
    <path d="M79 88h42l2 14c0 8-10 14-23 14s-23-6-23-14z" fill="#FFFFFF"/>
    <rect x="96" y="106" width="9" height="86" rx="4.5" fill="#FFFFFF"/>
    <circle cx="100.5" cy="192" r="4.5" fill="#FFFFFF"/>
  </g>
</svg>
